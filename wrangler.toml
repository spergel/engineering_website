name = "engineerlist"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Static files in public/ are served by the Worker via the ASSETS binding.
# The Worker calls `env.ASSETS.fetch(request)` for anything its router
# doesn't handle (style.css, /csv/*.csv, /favicon.ico, …).
[assets]
directory = "./public"
binding = "ASSETS"

# `npm run setup` rewrites the database_id below after creating the D1 db.
# Routes read the DB via the `DB` binding (env.DB).
[[d1_databases]]
binding = "DB"
database_name = "engineers-db"
database_id = "d83d9b4e-0189-4274-bbdb-9037318d0438"
migrations_dir = "migrations"

# account_id is intentionally NOT set:
# - Local: wrangler reads it from your OAuth login or the
#   CLOUDFLARE_ACCOUNT_ID env var.
# - CI/Cloudflare build: injected automatically.
